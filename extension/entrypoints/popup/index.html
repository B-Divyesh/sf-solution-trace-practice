<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#24152f" />
    <title>Practice — Show Your Debugging</title>
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to practice</a>
    <header class="app-header">
      <div class="brand"><span aria-hidden="true">✓</span> Show Your Debugging</div>
      <button class="quiet-button" id="history-button" type="button">Receipts <span id="receipt-count">0</span></button>
    </header>
    <main id="main">
      <div class="eyebrow" id="step-label">Practice 1 of 3</div>
      <h1>Work the bug before you reveal the answer</h1>
      <p class="lead" id="step-help">Write one specific cause you can test.</p>
      <ol class="progress" aria-label="Practice progress">
        <li class="is-current" data-progress="hypothesis"><span>1</span> Guess</li>
        <li data-progress="test"><span>2</span> Test</li>
        <li data-progress="fix"><span>3</span> Fix</li>
      </ol>
      <section id="workspace" aria-live="polite"></section>
      <p class="status" id="status" role="status"></p>
    </main>
    <footer>
      <p>Stored only in this browser.</p>
      <a href="https://solution-trace-practice.sociobot.in/privacy" target="_blank" rel="noreferrer">Privacy <span class="sr-only">(opens in a new tab)</span></a>
    </footer>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
